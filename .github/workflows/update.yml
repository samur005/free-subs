name: Update free subs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "Filter working nodes"
        type: boolean
        default: true
      max_keep:
        description: "Max working nodes to keep"
        type: string
        default: "400"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install singbox2proxy

      - name: Update subscriptions
        run: python update_free_subs.py

      - name: Filter working nodes with sing-box
        if: github.event_name == 'schedule' || inputs.filter == true
        env:
          MAX_KEEP: ${{ inputs.max_keep || '400' }}
          TIMEOUT: "8"
          WORKERS: "12"
        run: python filter_working.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add free_subs.txt free_subs.b64 free_subs_small.txt free_subs_small.b64
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update free subs $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi

      - name: Count configs
        run: |
          echo "Small: $(grep -c '://' free_subs_small.txt || true)"
          echo "Full:  $(grep -c '://' free_subs.txt || true)"